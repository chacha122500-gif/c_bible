<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>쑥쑥 성경 이야기</title>
    
    <!-- 귀여운 폰트 (배달의민족 주아체) 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <!-- 디자인을 위한 Tailwind CSS 불러오기 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React 및 Babel 불러오기 (브라우저에서 바로 React 실행) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 폰트 적용 클래스 */
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
    </style>
</head>
<body>
    <!-- 앱이 렌더링될 공간 -->
    <div id="root"></div>

    <!-- 앱 로직 (React 코드) -->
    <script type="text/babel">
        const { useState } = React;

        // 아이콘을 위한 SVG 컴포넌트 (외부 라이브러리 없이 단일 파일로 만들기 위해 추가)
        const CheckCircleIcon = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        );

        const XCircleIcon = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
        );

        function App() {
            const [modalState, setModalState] = useState({ isOpen: false, isCorrect: false });

            const handleAnswer = (isCorrect) => {
                setModalState({ isOpen: true, isCorrect });
            };

            const closeModal = () => {
                setModalState({ isOpen: false, isCorrect: false });
            };

            return (
                <div className="min-h-screen bg-[#cfe9ff] flex justify-center items-center font-jua p-2 sm:p-4">
                    
                    {/* 앱 메인 화면 */}
                    <div className="w-full max-w-[400px] h-[95vh] max-h-[850px] bg-[#39a5ff] rounded-[32px] sm:rounded-[40px] shadow-2xl relative overflow-hidden flex flex-col justify-between p-4 sm:p-5 border-4 sm:border-8 border-white box-border">
                        
                        {/* 1. 상단 헤더 영역 */}
                        <div className="shrink-0 w-full flex justify-center items-center mb-2 mt-1">
                            <span className="text-white text-lg sm:text-xl bg-white/20 px-5 py-1.5 rounded-full shadow-sm tracking-wide">
                            📖 쑥쑥 성경 이야기
                            </span>
                        </div>

                        {/* 2. 메인 캐릭터 카드 영역 */}
                        <div className="shrink-0 w-full bg-[#1c88ff] rounded-[28px] p-4 flex flex-col items-center relative shadow-md">
                            
                            {/* 말풍선 */}
                            <div className="bg-white text-[#1c88ff] px-4 py-2 rounded-3xl text-base mb-4 relative shadow-lg animate-bounce duration-1000">
                                안녕! 나는 다윗이야!
                                {/* 말풍선 꼬리 */}
                                <div className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[10px] border-t-white"></div>
                            </div>

                            {/* 비디오 영역 */}
                            <div className="w-40 h-48 sm:w-48 sm:h-56 rounded-2xl overflow-hidden border-[5px] border-white shadow-inner bg-[#8f8b89] flex justify-center items-center mb-3 relative">
                                <video
                                    src="https://raw.githubusercontent.com/chacha122500-gif/cha_portfolio/51167bff834d85218022f96a3c40ec6e917802da/dd.mp4"
                                    autoPlay
                                    loop
                                    muted
                                    playsInline
                                    className="w-full h-full object-contain"
                                />
                            </div>

                            {/* 짧은 설명 */}
                            <div className="bg-white/20 rounded-2xl px-4 py-1.5 text-white text-center text-sm sm:text-base leading-relaxed">
                                물매돌 하나로 거인 골리앗을<br />물리친 용감한 소년이에요!
                            </div>
                        </div>

                        {/* 3. 퀴즈 질문 영역 */}
                        <div className="flex-1 flex flex-col justify-center items-center text-center py-2">
                            <div className="text-[#ffe600] text-lg sm:text-xl mb-1 drop-shadow-sm">오늘의 퀴즈!</div>
                            <div className="text-white text-xl sm:text-2xl leading-snug drop-shadow-md">
                                다윗이 물매돌로 쓰러트린<br />거인의 이름은 무엇일까요?
                            </div>
                        </div>

                        {/* 4. 하단 버튼 영역 */}
                        <div className="shrink-0 w-full flex gap-3 h-24 sm:h-28 mb-1">
                            {/* 오답 버튼 (왼쪽) */}
                            <button 
                                onClick={() => handleAnswer(false)}
                                className="flex-1 bg-[#5d5a57] hover:bg-[#4d4a47] text-white rounded-[24px] flex flex-col items-center justify-center shadow-[0_6px_0_#43413e] active:shadow-[0_0px_0_#43413e] active:translate-y-1.5 transition-all"
                            >
                                <span className="text-2xl sm:text-3xl mb-1 tracking-widest">사울왕</span>
                                <span className="text-xs sm:text-sm text-gray-300 font-sans font-bold">오답일까?</span>
                            </button>

                            {/* 정답 버튼 (오른쪽) */}
                            <button 
                                onClick={() => handleAnswer(true)}
                                className="flex-1 bg-white hover:bg-gray-50 text-[#ff7700] rounded-[24px] flex flex-col items-center justify-center shadow-[0_6px_0_#d1d5db] active:shadow-[0_0px_0_#d1d5db] active:translate-y-1.5 transition-all relative overflow-hidden"
                            >
                                <span className="text-3xl sm:text-4xl mb-1 font-black">골리앗</span>
                                <span className="text-xs sm:text-sm text-gray-500 font-sans font-bold">정답 도전!</span>
                                
                                {/* 장식용 아이콘 */}
                                <div className="absolute top-2 right-2 opacity-20">
                                    <CheckCircleIcon size={24} />
                                </div>
                            </button>
                        </div>

                        {/* 결과 모달 */}
                        {modalState.isOpen && (
                            <div className="absolute inset-0 bg-black/60 flex justify-center items-center z-50 p-6 backdrop-blur-sm">
                                <div className="bg-white w-full rounded-[36px] p-8 flex flex-col items-center text-center shadow-2xl transform transition-transform scale-100 duration-300">
                                    {modalState.isCorrect ? (
                                        <>
                                            <div className="w-24 h-24 bg-green-100 rounded-full flex justify-center items-center mb-4">
                                                <CheckCircleIcon size={64} className="text-green-500" />
                                            </div>
                                            <h2 className="text-3xl text-green-500 mb-3">정답이에요!</h2>
                                            <p className="text-xl text-gray-600 mb-8">
                                                참 잘했어요!<br/>다윗이 쓰러트린 거인은<br/>골리앗이 맞아요. 🎉
                                            </p>
                                        </>
                                    ) : (
                                        <>
                                            <div className="w-24 h-24 bg-red-100 rounded-full flex justify-center items-center mb-4">
                                                <XCircleIcon size={64} className="text-red-500" />
                                            </div>
                                            <h2 className="text-3xl text-red-500 mb-3">아쉬워요!</h2>
                                            <p className="text-xl text-gray-600 mb-8">
                                                다시 한 번 생각해보세요.<br/>힌트: '골'로 시작해요! 🤔
                                            </p>
                                        </>
                                    )}
                                    
                                    <button 
                                        onClick={closeModal}
                                        className="w-full bg-[#39a5ff] text-white text-xl py-4 rounded-2xl shadow-md hover:bg-[#1c88ff] transition-colors"
                                    >
                                        {modalState.isCorrect ? "다음 이야기 보기" : "다시 풀어보기"}
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        // 앱을 화면에 그리기
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
